<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }} | JobMonitor</title>
    <link rel="stylesheet" href="{{ asset_path('css/app.css') }}" />
    <script src="{{ asset_path('js/telegram-web-app.js') }}"></script>
  </head>
  <body data-page="{{ active_page }}">
    <main class="page-shell">
      <header class="page-header">
        {% if back_url %}
        <a class="back-link" href="{{ back_url }}">← Аналитика</a>
        {% endif %}
        <h1>{{ page_title }}</h1>
        <p class="page-description">{{ page_description }}</p>
      </header>

      {% block content %}{% endblock %}
    </main>

    <script src="{{ asset_path('js/app.js') }}"></script>
  </body>
</html>
