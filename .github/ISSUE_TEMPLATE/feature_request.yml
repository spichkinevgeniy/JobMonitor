name: Предложить улучшение
description: Предложите улучшение для JobMonitor
title: "[Идея]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую проблему вы хотите решить?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Решение
      description: Опишите идею или желаемое поведение.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Дополнительная информация
      description: Ссылки, скриншоты, ограничения или связанные issues.
