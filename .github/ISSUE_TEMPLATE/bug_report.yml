name: Сообщить об ошибке
description: Расскажите об ошибке, которую можно воспроизвести
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опишите ошибку и ожидаемое поведение.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести?
      description: Укажите минимальную последовательность действий.
      placeholder: |
        1. Откройте…
        2. Запустите…
        3. Проверьте…
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия или коммит
      description: Тег, ветка или хеш коммита

  - type: textarea
    id: logs
    attributes:
      label: Логи или скриншоты
      description: Перед публикацией удалите секреты и личные данные.
