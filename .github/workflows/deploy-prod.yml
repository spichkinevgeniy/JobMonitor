name: Выкладка в продакшен

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или тег для выкладки"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Загрузка кода
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Установка uv
        uses: astral-sh/setup-uv@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Установка зависимостей
        run: uv sync --dev --frozen

      - name: Проверка качества
        run: make quality

      - name: Выкладка по SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            DEPLOY_REF="${{ github.event.inputs.ref }}"
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --all --prune --tags
            git checkout "$DEPLOY_REF"
            if git show-ref --verify --quiet "refs/remotes/origin/$DEPLOY_REF"; then
              git pull --ff-only origin "$DEPLOY_REF"
            else
              echo "Ref '$DEPLOY_REF' is not a remote branch; skipping git pull."
            fi
            echo "Server commit: $(git rev-parse --short HEAD)"
            make prod-deploy-all

      # Яндекс и Bing узнают о свежей главной без кабинетов вебмастера.
      # Ключ берётся с живого сайта: заодно видно, что он отдаётся.
      # Сбой уведомления выкладку не валит.
      - name: Уведомление поисковиков (IndexNow)
        continue-on-error: true
        env:
          SITE: https://jobmonitor-it.com
        run: |
          key=""
          for attempt in $(seq 1 20); do
            key=$(curl -fsS --max-time 10 "$SITE/indexnow.txt") && break
            sleep 6
          done
          if [ -z "$key" ]; then
            echo "Ключ $SITE/indexnow.txt недоступен, уведомление пропущено"
            exit 1
          fi
          payload=$(printf '{"host":"%s","key":"%s","keyLocation":"%s/indexnow.txt","urlList":["%s/","%s/llms.txt"]}' \
            "${SITE#https://}" "$key" "$SITE" "$SITE" "$SITE")
          for endpoint in https://api.indexnow.org/indexnow https://yandex.com/indexnow; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$endpoint" \
              -H 'Content-Type: application/json; charset=utf-8' -d "$payload")
            echo "$endpoint → $code"
          done
