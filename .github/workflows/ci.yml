name: Проверки

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Настоящий Postgres для интеграционных тестов: они идут в make quality
    # вместе с остальными. Та же версия, что на проде.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobmonitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d jobmonitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DB: "1"
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: jobmonitor_test
    steps:
      - name: Загрузка кода
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Установка зависимостей
        run: uv sync --dev --frozen

      - name: Проверка качества
        run: make quality

      - name: Проверка конфигурации мониторинга
        run: docker compose -f docker-compose.observability.yml config --quiet
