services:
  prometheus:
    image: prom/prometheus:latest
    container_name: job_monitor_prometheus
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - job_monitor_backend

  grafana:
    image: grafana/grafana:latest
    container_name: job_monitor_grafana
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - job_monitor_backend

volumes:
  prometheus_data:
  grafana_data:

networks:
  job_monitor_backend:
    external: true
    name: job_monitor_backend
